name: up_2048
description: "Up2048 - an offline 2048 puzzle with four difficulty levels."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#2B2D42"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  remove_alpha_ios: true
  background_color_ios: "#2B2D42"
  web:
    generate: true
    image_path: "assets/images/icon_maskable.png"
    background_color: "#2B2D42"
    theme_color: "#2B2D42"
